<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Rastros · Track Classifier</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#050A05" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Track Classifier" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

  <!-- Leaflet CSS (CDN; cached after first load for offline use) -->
  <link rel="stylesheet" href="/static/vendor/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #050A05;
      --surface:  rgba(12,20,12,0.92);
      --text:     #F5F0E8;
      --text-sec: #8A9E8A;
      --muted:    #4A5A4A;
      --accent:   #7CBA6E;
      --border:   rgba(124,186,110,0.18);
      --error:    #C4614A;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      background: rgba(5,10,5,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(124,186,110,0.12);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; color: var(--text-sec);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid rgba(124,186,110,0.15);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-back:hover { color: var(--text); border-color: rgba(124,186,110,0.35); }
    .nav-title {
      font-size: 16px; font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .nav-count {
      margin-left: auto;
      font-size: 11px; font-family: 'DM Mono', monospace;
      color: var(--muted);
      padding: 4px 10px;
      border: 1px solid rgba(124,186,110,0.1);
      border-radius: 10px;
    }

    /* ── Map container ── */
    #map {
      position: fixed;
      top: 53px; left: 0; right: 0; bottom: 0;
    }

    /* ── Offline warning ── */
    #offline-warn {
      display: none;
      position: fixed;
      top: 66px; left: 50%; transform: translateX(-50%);
      z-index: 900;
      background: rgba(196,97,74,0.12);
      border: 1px solid rgba(196,97,74,0.4);
      color: #E8846A;
      font-size: 12px; font-family: monospace;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Empty state ── */
    #empty-overlay {
      display: none;
      position: fixed;
      top: 53px; left: 0; right: 0; bottom: 0;
      z-index: 800;
      background: var(--bg);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      text-align: center;
    }
    #empty-overlay .icon { font-size: 48px; opacity: 0.3; }
    #empty-overlay p { color: var(--muted); font-size: 14px; }

    /* ── Leaflet custom styles ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
      color: var(--text) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: auto !important;
      min-width: 200px;
      max-width: 280px;
    }
    .leaflet-popup-tip {
      background: rgba(12,20,12,0.92) !important;
    }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      font-size: 18px !important;
      padding: 6px 8px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    /* ── Custom layer toggle ── */
    #layer-toggle {
      position: fixed;
      top: 80px; right: 12px;
      z-index: 900;
      background: rgba(20,20,20,0.85);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .layer-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .layer-btn:hover   { background: rgba(255,255,255,0.1); }
    .layer-btn.active  { background: #2d6a4f; }
    .leaflet-bar a {
      background: rgba(12,20,12,0.9) !important;
      color: var(--text-sec) !important;
      border-color: rgba(124,186,110,0.2) !important;
    }
    .leaflet-bar a:hover { color: var(--text) !important; }

    /* Popup inner */
    .popup-inner { padding: 14px 16px; }
    .popup-species {
      font-size: 16px; font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .popup-sci {
      font-size: 12px; font-style: italic;
      color: var(--text-sec);
      margin-bottom: 10px;
    }
    .popup-meta {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .popup-badge {
      font-size: 10px; font-family: monospace;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(124,186,110,0.25);
      color: var(--accent);
      background: rgba(124,186,110,0.07);
    }
    .popup-badge.teal {
      border-color: rgba(45,212,191,0.3);
      color: #2DD4BF;
      background: rgba(45,212,191,0.07);
    }
    .popup-date {
      font-size: 11px; font-family: monospace;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .popup-conservation {
      font-size: 11px; font-family: monospace;
      color: #C4A04A;
      margin-bottom: 8px;
    }
    .popup-coords {
      font-size: 10px; font-family: monospace;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .popup-action {
      font-size: 12px; font-weight: 600;
      color: #E8846A;
      background: rgba(196,97,74,0.08);
      border-left: 3px solid rgba(196,97,74,0.5);
      padding: 8px 10px;
      border-radius: 0 6px 6px 0;
      line-height: 1.4;
    }
    .popup-action-label {
      font-size: 9px; font-family: monospace;
      color: #C4614A;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    /* ── Mouse coordinates display ── */
    #coords-display {
      position: fixed;
      bottom: 28px; left: 10px;
      z-index: 900;
      background: rgba(5,10,5,0.82);
      border: 1px solid rgba(124,186,110,0.15);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 11px; font-family: 'DM Mono', monospace;
      padding: 4px 10px;
      border-radius: 8px;
      pointer-events: none;
      min-width: 168px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.15s;
    }
    #coords-display.visible { opacity: 1; }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-back" href="/">← Volver</a>
  <span class="nav-title">🗺 Mapa de Rastros</span>
  <span class="nav-count" id="count-badge">0 registros</span>
</nav>

<!-- Offline warning -->
<div id="offline-warn">⚠ Tiles sin conexión — usando caché del navegador</div>

<!-- Empty state -->
<div id="empty-overlay">
  <span class="icon">🏖️</span>
  <p>Sin registros con coordenadas GPS aún.</p>
  <p style="font-size:12px;color:#3A4A3A;">Clasifica imágenes con GPS en EXIF o ingresa coords manualmente.</p>
</div>

<!-- Layer toggle -->
<div id="layer-toggle">
  <button class="layer-btn active" data-layer="standard">🗺️ Estándar</button>
  <button class="layer-btn" data-layer="satellite">🛰️ Satélite</button>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Cursor coordinates -->
<div id="coords-display">—</div>

<!-- Leaflet JS (CDN) -->
<script src="/static/vendor/leaflet.js"></script>

<script>
'use strict';

/* ── Utility ── */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── Init map (scrollWheelZoom is true by default) ── */
const map = L.map('map', { zoomControl: true });

/* ── Tile layers ── */
const osmTiles = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; OpenStreetMap &copy; CartoDB',
    subdomains: 'abcd',
    maxZoom: 19,
    crossOrigin: true,
  }
);

const esriTiles = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Tiles &copy; Esri &mdash; Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, GIS User Community',
    maxZoom: 19,
  }
);

osmTiles.addTo(map);

/* ── Graceful degradation: detect tile failures ── */
let tileErrors = 0;
let offlineShown = false;
function onTileError() {
  tileErrors++;
  if (tileErrors >= 3 && !offlineShown) {
    offlineShown = true;
    document.getElementById('offline-warn').style.display = 'block';
  }
}
osmTiles.on('tileerror', onTileError);
esriTiles.on('tileerror', onTileError);

/* ── Custom layer toggle ── */
let activeLayer = osmTiles;

document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.layer === 'satellite' ? esriTiles : osmTiles;
    if (target === activeLayer) return;
    map.removeLayer(activeLayer);
    target.addTo(map);
    activeLayer = target;
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* ── Mouse coordinates ── */
const coordsEl = document.getElementById('coords-display');
map.on('mousemove', e => {
  coordsEl.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
  coordsEl.classList.add('visible');
});
map.on('mouseout', () => coordsEl.classList.remove('visible'));

/* ── Markers ── */
const group = L.featureGroup();

const SPECIES_PALETTE = ['#4CAF50', '#2196F3', '#FF9800', '#E91E63', '#9C27B0', '#00BCD4', '#FF5722'];
function speciesColor(name) {
  if (!name) return SPECIES_PALETTE[0];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (Math.imul(31, h) + name.charCodeAt(i)) | 0;
  return SPECIES_PALETTE[Math.abs(h) % SPECIES_PALETTE.length];
}

function addMarker(m) {
  const isTurtle = m.mode === 'turtle';
  const color = speciesColor(m.species);
  const conf = m.confidence || 0;

  const circle = L.circleMarker([m.latitude, m.longitude], {
    radius: 9,
    fillColor: color,
    color: '#050A05',
    weight: 2,
    fillOpacity: 0.88,
  });

  const modeBadge = isTurtle
    ? '<span class="popup-badge">🐢 TORTUGAS</span>'
    : '<span class="popup-badge teal">🐾 FAUNA</span>';

  const confColor = conf >= 75 ? '#7CBA6E' : conf >= 50 ? '#C4A04A' : '#C4614A';
  const confBadge = `<span class="popup-badge" style="color:${confColor};border-color:${confColor}40;">${conf}%</span>`;

  const conservationHtml = m.conservation_status
    ? `<div class="popup-conservation">⚠ ${escapeHtml(m.conservation_status)}</div>`
    : '';

  const actionHtml = m.immediate_action
    ? `<div class="popup-action-label">Acción inmediata</div>
       <div class="popup-action">${escapeHtml(m.immediate_action)}</div>`
    : '';

  circle.bindPopup(`
    <div class="popup-inner">
      <div class="popup-species">${escapeHtml(m.species || '—')}</div>
      <div class="popup-sci">${escapeHtml(m.scientific_name || '')}</div>
      <div class="popup-meta">${modeBadge}${confBadge}</div>
      <div class="popup-date">📅 ${escapeHtml(m.timestamp || '')}</div>
      ${conservationHtml}
      <div class="popup-coords">📍 ${m.latitude.toFixed(5)}, ${m.longitude.toFixed(5)}</div>
      ${actionHtml}
    </div>
  `, { maxWidth: 300 });

  group.addLayer(circle);
}

function renderMarkers(markers) {
  const withGps = markers.filter(m => m.latitude != null && m.longitude != null);
  withGps.forEach(addMarker);
  group.addTo(map);

  const countBadge = document.getElementById('count-badge');
  if (withGps.length > 0) {
    countBadge.textContent = withGps.length + ' registro' + (withGps.length !== 1 ? 's' : '');
    if (withGps.length === 1) {
      map.setView([withGps[0].latitude, withGps[0].longitude], 13);
    } else {
      map.fitBounds(group.getBounds().pad(0.25));
    }
  } else {
    countBadge.textContent = '0 registros';
    map.setView([20.2114, -87.4654], 13); // Tulum, Quintana Roo
    document.getElementById('empty-overlay').style.display = 'flex';
  }
}

/* ── Load historical markers from Supabase via /api/classifications ── */
fetch('/api/classifications', { credentials: 'include' })
  .then(r => r.ok ? r.json() : [])
  .then(data => renderMarkers(Array.isArray(data) ? data : []))
  .catch(() => renderMarkers([]));
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(r => console.log('[SW] scope:', r.scope))
        .catch(e => console.warn('[SW] failed:', e));
    });
  }
</script>
</body>
</html>
